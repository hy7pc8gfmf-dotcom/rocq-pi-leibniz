name: CI

# Package-level CI for rocq-pi-leibniz — a single self-hosted job.
#
# The job seeds the trust cache (.vo) from the pinned local clone so the
# build step is a pure skip pass, then certifies the whole dependency
# closure with rocqchk -o and runs the assumption smoke check on the two
# main theorems.  On a machine without the local cache the same steps
# simply compile everything from source.  All compilation runs wrapped
# in the machine's cpu guard (thermal duty-cycling), as in the hosting
# campaign's ConstructiveWorld-Main CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rocq-pi-leibniz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + coqchk (self-hosted, local trust cache)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 480
    env:
      # Form-A (Rocq 9.3 wave 20261102): inject the opam-root 9.3 toolchain
      # into the three CI scripts (PI_ROCQ_BIN; default in-script = 9.1).
      # Guard passthrough verified: Start-Process cmd /c without
      # -UseNewEnvironment propagates job env through bash->pwsh->cmd->bash.
      PI_ROCQ_BIN: /d/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin
      # 9.3 trust-cache seed source (wave 20261103): 41 .vo @ magic 90300,
      # built from the current theories sources (stale=0 vs .v) — the seed
      # era-guard probe matches (90300==90300) so seeding engages and the
      # build becomes a skip pass; coqchk still certifies the FULL closure.
      PI_TRUST_CACHE: /d/ComplexAnalysis/attn/rocq93_work_20261101/pi93_e2e
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Seed trust cache from the local clone
        run: bash scripts/seed_trust_cache.sh

      - name: Build (skip pass over the trust cache)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "D:\ComplexAnalysis\规范术语\温控协议\cpu_guard_v3.ps1" -Command "bash scripts/pi_ci_build.sh" -LoadLimit 60 -TempLimit 98 -CoreN 2 -AllowG3 -GearForce 0

      # ── KB95 W3: reconcile the tree against the attestation archive ─────
      # Reconciles the checked-out tree against the minted archive
      # scripts/coqchk_attestation.json (cw.attest/v1): per-file
      # CRLF-normalized source sha256, verdicts CLEAN/DIRTY/MISSING/ADDED
      # reported into scripts/attest_report.json and this log.  Report-
      # only: the script exits 0 on every outcome (the || echo is a second
      # net for environment errors), and nothing skips certification —
      # the coqchk step below still verifies the FULL closure
      # (sent_to_chk=0; the skip-list mechanic is v2, deferred).
      - name: content-addressed attestation (v1 report-only)
        run: |
          bash scripts/pi_attest_reconcile.sh || echo "ATT-RECON-FALLBACK: reconcile could not run; continuing (v1 report-only, coqchk below unaffected)"

      - name: coqchk full-closure certification + assumption smoke
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "D:\ComplexAnalysis\规范术语\温控协议\cpu_guard_v3.ps1" -Command "bash scripts/pi_ci_chk.sh" -LoadLimit 60 -TempLimit 98 -CoreN 2 -AllowG3 -GearForce 0

      - name: Toolchain version evidence
        if: always()
        run: |
          # evidence must reflect the toolchain the build actually used
          # (bare rocq on machine PATH = 9.1 platform; #39 lesson 20261102)
          export PATH="$PI_ROCQ_BIN:$PATH"
          rocq c --version
          rocqchk --version

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            coqchk.log
            smoke.log
            scripts/attest_report.json
