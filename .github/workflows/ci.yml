name: CI

# Package-level CI for rocq-pi-leibniz (GitHub-hosted ubuntu runners).
# Reference structure: the hosting campaign's ConstructiveWorld-Main coq.yml;
# the self-hosted trust-cache seeding and thermal-guard segments do not
# apply here and are intentionally absent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rocq-pi-leibniz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rocq ${{ matrix.rocq-version }} build + coqchk (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      # Matrix: the Rocq 9.1 line plus 9.2 / 9.3 / master legs.  The 9.1
      # pins were verified against the opam repository (2026-10-15): the
      # 9.1-line prover is published as rocq-core / rocq-runtime
      # (rocq-prover has no 9.1.x releases); rocq-core.9.1.1 is the
      # latest 9.1-line patch and pins rocq-runtime {= version};
      # rocq-stdlib.9.1.0 is the only 9.1-line stdlib release and accepts
      # rocq-core >= 9.0 & < 9.3.0.
      #
      # The 9.2 / 9.3 / master legs were added as a static edit only —
      # CI-verified-next-run.  Package names follow the official opam
      # conventions (rocq-prover from the 9.2 line on); exact patch
      # versions are the earliest of each line and the dev-repo pin
      # forms for the master leg are TODO: confirm against the live
      # opam repository at the first matrix run.
      matrix:
        include:
          # 9.1-line compatibility floor (unchanged leg).
          - rocq-version: "9.1.1"
            stdlib-version: "9.1.0"
            prover-package: "rocq-core"
          # 9.2 line: rocq-stdlib 9.1.0 accepts cores >= 9.0 & < 9.3.0,
          # so the (verified) 9.1.0 stdlib release pairs with a 9.2 core.
          - rocq-version: "9.2.0"
            stdlib-version: "9.1.0"
            prover-package: "rocq-prover"
          # 9.3 line: the < 9.3.0 bound of rocq-stdlib 9.1.0 excludes a
          # 9.3 core; a 9.3-line stdlib release is assumed to exist.
          - rocq-version: "9.3.0"
            stdlib-version: "9.3.0"
            prover-package: "rocq-prover"
          # master leg: no fixed opam version exists for an unreleased
          # prover line; pin the prover and the standard library from
          # the Rocq git master branches (dev pins; TODO
          # CI-verified-next-run — confirm repository layout).
          - rocq-version: "master"
            prover-package: "rocq-prover"
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Install system packages (GMP for zarith)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev

      - name: Set up OCaml 4.14 + opam (cached switch)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          cache: true

      - name: Install Rocq ${{ matrix.rocq-version }} toolchain (pinned)
        run: |
          if [ "${{ matrix.rocq-version }}" = "master" ]; then
            # master leg: pin the prover and the standard library from
            # the git master branches (opam picks up every package in
            # each dev tree; TODO CI-verified-next-run).
            opam pin add -y --no-action \
              "git+https://github.com/rocq-prover/rocq.git#master"
            opam pin add -y --no-action \
              "git+https://github.com/rocq-prover/stdlib.git#master"
            opam install -y rocq-prover rocq-stdlib
          else
            opam install -y \
              "${{ matrix.prover-package }}.${{ matrix.rocq-version }}" \
              "rocq-stdlib.${{ matrix.stdlib-version }}"
          fi

      - name: Toolchain version evidence
        run: |
          opam exec -- rocq c --version
          opam exec -- rocqchk --version

      - name: Build (bootstrap Makefile.coq from _CoqProject, full compile)
        run: |
          set -euo pipefail
          opam exec -- make -j2
          built=$(find theories -name '*.vo' | wc -l)
          srcs=$(find theories -name '*.v' | wc -l)
          echo "compiled .vo: ${built} / registered .v: ${srcs}"
          [ "${built}" -eq "${srcs}" ]

      - name: coqchk full-closure certification (assumption summary must be all-none)
        run: |
          set -euo pipefail
          # Content modules carry bare logical names (empty-root mapping);
          # only the root re-export module lives under the pi_leibniz prefix.
          mods=$(find theories/Reals/Cauchy -name '*.vo' | sed -e 's|.*/||' -e 's|\.vo$||' | sort)
          mods="$mods pi_leibniz.PiLeibniz"
          echo "coqchk modules: $(echo "$mods" | wc -l)"
          echo $mods | tr ' ' '\n'
          opam exec -- rocqchk -o -Q theories pi_leibniz -Q theories/Reals/Cauchy "" $mods 2>&1 | tee coqchk.log
          grep -q "Modules were successfully checked" coqchk.log
          dirty=$(grep "Axioms:" coqchk.log | grep -vc "<none>" || true)
          echo "non-none Axioms sections: ${dirty}"
          [ "${dirty}" -eq 0 ]

      - name: Smoke — root module loads, main theorems assumption-closed
        run: |
          set -euo pipefail
          cat > /tmp/piu_smoke_tmp.v <<'EOF'
          From Stdlib Require Import QArith.QArith.
          From pi_leibniz Require Import PiLeibniz.
          Print Assumptions pi_leibniz_strong_irrational.
          Print Assumptions pi_leibniz_appart_all_Q.
          EOF
          opam exec -- rocq c -q -Q theories pi_leibniz -Q theories/Reals/Cauchy "" /tmp/piu_smoke_tmp.v 2>&1 | tee smoke.log
          n=$(grep -c "Closed under the global context" smoke.log || true)
          echo "assumption-closed count: ${n} (expect 2)"
          [ "${n}" -eq 2 ]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            coqchk.log
            smoke.log
